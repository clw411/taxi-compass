<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Compass - Day 5</title>
  <meta name="referrer" content=""origin-when-cross-origin">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #status {
        position: absolute; bottom: 20px; left: 10px; z-index: 2000;
        background: white; padding: 8px 12px; border: 2px solid #333;
        font-family: monospace; font-size: 14px;
    }
    #refresh-btn {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        z-index: 1000; padding: 10px 20px; background: #0077b6; color: white;
        border: none; border-radius: 6px; font-size: 16px; font-weight: bold;
        cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        font-family: system-ui, sans-serif;
    }
    #refresh-btn:disabled { opacity: 0.6; cursor: default; }

    .map-title {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(255,255,255,0.9); padding: 8px 14px; 
      border-radius: 6px; font-family: system-ui, sans-serif;
      font-size: 14px; font-weight: 500;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Taxi count badge (inline style to absolutely guarantee visibility)-->
  <div id="taxi count"
        style="
          position: absolute;
          top: 70px;
          right: 10px;
          z-index: 9999;
          background: rgba(0,0,0,0.75);
          color: white;
          padding: 14px 28px;
          border-radius: 4px;
          font-family: system-ui, sans-serif;
          font-size: 18px;
          font-weight: 500;
          box-shadow: 0 2px 6px rgba(0,0,0,0.3);
          white-space: nowrap;
          ">
        🚖<span id="count-number">-</span> taxis available</div>
  <div id="status">⏳ Loading... </div>
  <button id="refresh-btn">🔄 Refresh Taxis </button>


  <script>
    const statusEl = document.getElementById('status');
    function setStatus(msg) { statusEl.textContent = '🟡 ' + msg; }


    // 1. Map setup
    const map = L.map('map').setView([1.3521, 103.8198], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OSM, © CARTO',
      maxZoom: 19
    }).addTo(map);

    // 2. Layer group for taxis (THIS LINE MUST BE PRESENT)
    const taxiLayerGroup = L.layerGroup().addTo(map);

    // 3. Fetch with timeout
    async function fetchTaxis() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);
        
      try {
        const response = await fetch('https://api.data.gov.sg/v1/transport/taxi-availability', {
            signal: controller.signal
        });
        clearTimeout(timeoutId);


        if (!response.ok) throw new Error (`HTTP ${response.status}`);
        const data = await response.json();
        const coords = data.features[0].geometry.coordinates;
        taxiLayerGroup.clearLayers();
        let count = 0;
        for (const pair of coords) {
          const lng = pair[0];
          const lat = pair[1];
          L.circleMarker([lat, lng], {
            radius: 4, fillColor: '#oo77b6', color: '#005f8c', weight: 1, fillOpacity: 0.8}).addTo(taxiLayerGroup);
          count++;
        }
        document.getElementById('count-number').textContent = count;
        setStatus('✅ ' + count + ' taxis loaded (live) ');
      } catch (e) {
        if (e. name === 'AbortError') {
          setStatus('❌ Request timed out after 5 seconds');
        } else {
          setStatus('❌' + e.message);  
        }
      } finally {
        clearTimeout(timeoutId);
      }
    }


    // 4. Initial load
    fetchTaxis();

    // 5. Refresh button with 60-second cooldown
    const refreshBtn = document.getElementById('refresh-btn');
    let cooldownTimer = null;

    function startCooldown() {
        let secondsLeft = 60;
        refreshBtn.disabled = true;
        refreshBtn.textContent = `⏳ Wait ${secondsLeft}s`;

        cooldownTimer = setInterval(() => {
            secondsLeft--;
            if (secondsLeft <=0) {
                clearInterval(cooldownTimer);
                cooldownTimer = null;
                refreshBtn.textContent = '🔄 Refresh Taxis';
                refreshBtn.disabled = false;
            } else {
              refreshBtn.textContent = `⏳ Wait ${secondsLeft}s`;
            }
        }, 1000);
    }

    refreshBtn.addEventListener('click', async () => {
        if (refreshBtn.disabled) return;                // already in cooldown or fetching
        
        refreshBtn.textContent = '⏳ Fetching…';
        refreshBtn.disabled = true;
        setStatus('Fetching...');

        await fetchTaxis(); 

        // Start cooldown after fetch completes (or times out)
        startCooldown();
    });
  </script>
</body>
</html>
