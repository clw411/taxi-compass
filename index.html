<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Taxi Compass - Find street-hailable taxis near you</title>

    <!-- Leaflet CSS + JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>"

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .map-title {
            position: absolute;
            top: 10px;
            right: 10px;  /* moved to top-right corner */
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class=""map-title">🚖 Taxi Compass - street-hailable taxis, made visible </div>

    <script>
        // Initialise map centered on Singapore
        const map = L.map('map').setView([1.3521, 103.8198], 13);


        // OpenStreetMap tiles
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        console.log('Day 1: Map is live. Tomorrow we fetch the Taxi Availability API.');
    </script>
</body>
</html>
