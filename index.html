<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="origin-when-cross-origin">
    <title> Taxi Compass - Find street-hailable taxis near you</title>

    <!-- Leaflet CSS + JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>"

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .map-title {
            position: absolute;
            top: 10px;
            right: 10px;  /* moved to top-right corner */
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="map-title">🚖 Taxi Compass - street-hailable taxis, made visible </div>

    <script>
        // Initialise map centered on Singapore
        const map = L.map('map').setView([1.3521, 103.8198], 13);


        // OpenStreetMap tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap </a> contributors, © <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        console.log('Day 1: Map is live. Tomorrow we fetch the Taxi Availability API.');

        // Day 2: Fetch live taxi data from LTA via data.gov.sg
        async function fetchTaxis() {
            try {
              const response = await fetch('https://api.data.gov.sg/v1/transport/taxi-availability');
              if (!response.ok) {
                throw new Error(`HTTP error ${response.status}`);
              }
              const data = await response.json();
              const features = data.item.features; // array of taxi GeoJSON points
              console.log('Taxi features array:', features);
              console.log('Number of taxis available:', features.length);
              console.log('First taxi coordinates [lng, lat]:', features[0].geometry.coordinates);

              // Day 3: Plot taxis as circle markers
              taxiLayerGroup.clearLayers(); // remove old markers if we ever re-fetch

              features.forEach(feature => {
                const [lng, lat] = feature.geometry.coordinates;       // unpack in API order
                L.circleMarker([lat, lng], {                           // repack in Leaflet order
                    radius: 4,
                    fillColor: "#0077b6",
                    color: "#005f8c",
                    weight: 1,
                    fillOpacity: 0.8
                }).addTo(taxiLayerGroup);
              });
            } catch (error) {
                console.error('failed to fetch taxi data:', error);
            }
        }
        

        fetchTaxis();
    </script>
</body>
</html>
