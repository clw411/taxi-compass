<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Compass - Day 6</title>

  <!-- Referrer policy ensures tile servers get the Referer header, avoiding 403 errors-->
  <meta name="referrer" content="origin-when-cross-origin">

  <!-- Leaflet CSS and JavaScript libraries (loaded from a CDN, no local installation needed)-->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Make the map fill the entire browser window */
    html, body, #map { height: 100%; margin: 0; }
    .map-title {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.9);
      padding: 8px 14px;
      border-radius: 6px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      pointer-events: none;
    }

    #taxi-count {
      position: absolute;
      top: 70px;
      right: 10px;
      z-index: 9999;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 14px 0px;
      width: 220px;
      text-align: center;
      border-radius: 4px;
      font-family: system-ui, sans-serif;
      font-size: 18px;
      font-weight: 500;
      box-shadow: 0 2 px 6px rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    /* Status box - sits at bottom-left, shows what the app is doing (loading, errors, success) */
    #status {
        position: absolute; 
        bottom: 20px; 
        left: 10px; 
        z-index: 2000;     /* well above the map tiles */
        background: white; 
        padding: 8px 12px; 
        border: 2px solid #333;
        font-family: monospace; 
        font-size: 14px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* Refresh button - centered at the bottom of the screen */
    #refresh-btn {
        position: absolute; 
        bottom: 20px; 
        left: 50%; 
        transform: translateX(-50%);   /* perfect horizontal centering */
        z-index: 1000; 
        padding: 10px 20px; 
        background: #0077b6; 
        color: white;
        border: none; 
        border-radius: 6px; 
        font-size: 16px; 
        font-weight: bold;
        cursor: pointer; 
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        font-family: system-ui, sans-serif;
        transition: background 0.2s ease, opacity 0.2s ease;
    }

    /* Interactive hover state for high interaction */
    #refresh-btn:hover:not(:disabled) {
      background: #005f8c;
    }

    /* When the button is disabled (e.g. during cooldown), make it look inactive */
    #refresh-btn:disabled { opacity: 0.6; cursor: default; }

    /* Responsive adjustments for mobile layouts to guarantee cross-browser/device compatibility */
    @media (max-width: 600px) {
      .map-title {
        font-size: 12px;
        width: 220px;
        text-align: center;
      }
      #taxi-count {
        top: auto;
        bottom: 80px;
        left: 50px;
        transform: translateX(-50%);
      }
      #status {
        /* Move the status box out of the way of the bottom-centered refresh button */
        bottom: auto;                   /* Cancels out the desktop bottom position */
        top: 130px;                     /* Anchors it cleanly near the top right instead */
        right: 10px;
        left: auto;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- The div that becomes the interactive map -->
  <div id="map"></div>

  <!-- The title of the Map on the top-right corner of the interface -->
  <div class="map-title">🚖 Taxi Compass — street-hailable taxis, made visible</div>

  <!-- Taxi count badge - solid, dark box at top-right, shows total available taxis. (inline style to absolutely guarantee visibility with CSS conflicts)-->
  <div id="taxi-count"
        style="
          position: absolute;
          top: 70px;
          right: 10px;
          z-index: 9999;
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 14px 0px;              /* vertical padding only, horizontal is auto-centered */ 
          width: 220px;                   /* fixed width for a consistent box shape */
          text-align: center;
          border-radius: 4px;
          font-family: system-ui, sans-serif;
          font-size: 18px;
          font-weight: 500;
          box-shadow: 0 2px 6px rgba(0,0,0,0.3);
          white-space: nowrap;
          ">
        🚖<span id="count-number">-</span> taxis available</div>
  
  <!-- On-screen status indicator - shows messages like "Loading...", or errors -->
  <div id="status">⏳ Loading... </div>

  <!-- Refresh button - triggers a new data fetch -->
  <button id="refresh-btn">🔄 Refresh Taxis </button>


  <script>
    // ---------------------------------------------------------------
    // HELPER FUNCTION - updates the on-screen status message
    //----------------------------------------------------------------
    const statusEl = document.getElementById('status');
    function setStatus(icon, msg) { 
        statusEl.textContent = `${icon} ${msg}`; 
    }   // yellow dot prefix for visibility


    // ==============================================================
    // 🌐 NEW GLOBAL ENGINE STORAGE (Tuesday Stream Integration)
    // ==============================================================

    // Caches raw NEA reporting station metadata and real-time temperature readings
    let liveWeatherStations = [];

    // Stores the raw geographic [lng, lat] coordinate arrays streams from LTA
    let liveTaxiLocations = [];

    // Caches regional 2-hour verbal forecast synopses mapped to sector centers
    let liveForecastAras = []; 

    // ===============================================================
    // ☁️ NEW API FETCH ENGINE LINES (Tuesday Stream Integration)
    // ===============================================================

    // Fetch Engine 1: Real-time air temperature metrics
    async function getWeatherData() {
        try {
            console.log("🌡️ FETCHING LIVE WEATHER TEMPERATURE DATA...");

            // Establish network request to the public NEA climate monitoring endpoint
            const response = await fetch('https://api.data.gov.sg/v1/environment/air-temperature');
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

            const data = await response.json();

            // Extract the separate geographic station logs and the current sensor readings
            const stations = data.metadata.stations;
            const readings = data.items[0].readings;

            // Deep-map arrays to pair structural metadata directly with active climate readings
            liveWeatherStations = stations.map(station => {
                // Cross-reference sensor IDs to stitch matching telemetry together
                const reading = readings.find(r => r.station_id === station.id);
                return {
                    id: station.id,
                    name: station.name,
                    lat: station.location.latitude,
                    lng: station.location.longitude,
                    temp: reading ? reading.value : null
                };
            }).filter(s => s.temp !== null); // Drop offline or non-reporting stations from memory

            console.log(`📦 TEMPERATURE METRICS DATA RECEIVED. Loaded ${liveWeatherStations.length} reporting towers.`);
        } catch (error) {
            console.error("❌ Error fetching Air Temperature:", error);
        }
    }

    // Fetch Engine 2: Streams real-time spatial coordinate clusters for active commuter fleets
    async function getTaxiData() {
        try {
            console.log("🚖 FETCHING LIVE TAXI GEOLOCATION DATA...");

            // Connect to LTA's real-time transit telemetry broadcast
            const response = await fetch('https://api.data.gov.sg/v1/transport/taxi-availability');
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

            const data = await response.json();

            // Drill straight into GeoJSON feature nodes to map raw spatial [lng, lat] pairings
            liveTaxiLocations = data.features[0].geometry.coordinates;

            console.log(`📦 TAXI LOCATION METRICS RECEIVED. Buffered ${liveTaxiLocations.length} active coordinates.`);
        } catch (error) {
            console.error("❌ Error fetching Taxi Locations:", error);
        }
    }

    // Fetch Engine 3: Streams and extracts modern v2 2-Hour verbal forecast sectors
    async function getWeatherForecastData() {
        try {
            console.log("☁️ FETCHING LIVE v2 2-HOUR WEATHER FORECASTS...");

            // Query the modernized GovTech real-time open-data meterological stream
            const response = await fetch('https://api-open.data.gov.sg/v2/real-time/api/two-hr-forecast');
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

            const jsonResult = await response.json();

            // Separate spatial polygon sector headers from the situational forecast notes
            const metadata = jsonResult.data.area_metadata;
            const forecasts = jsonResult.data.items[0].forecasts;

            // Iterate through every official urban sector to cross-stitch verbal climate tags
            liveForecastAreas = metadata.map(area => {
                // Pinpoint the text forecast string matching this specific region name
                const matchingForecast = forecasts.find(f => f.area === area.name);
                return {
                    name: area.name,
                    lat: area.label_location.latitude,
                    lng: area.label_location.longitude,
                    forecast: matchingForecast ? matchingForecast.forecast : "Data Unavailable"
                };
            });

            console.log(`📦 v2 FORECAST DATA RECEIVED. Loaded ${liveForecastAreas.length} planning sectors.`);
        } catch (error) {
            console.error("❌ Error fetching v2 Weather Forecast:", error);
        }
    }
    // ----------------------------------------------------------------
    // 1. Map setup
    // ----------------------------------------------------------------
    // Create the Leaflet map, center on Singapore, zoom level 13
    const map = L.map('map').setView([1.3521, 103.8198], 13);

    // Add CartoDB light tiles - works on all browsers without referrer issues
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OSM, © CARTO',         // open-source attribution
      maxZoom: 19
    }).addTo(map);


    // 2. Layer group for taxis (THIS LINE MUST BE PRESENT). This LayerGroup holds all taxi markers - makes it easy to clear and redraw them
    const taxiLayerGroup = L.layerGroup().addTo(map);

    // -----------------------------------------------------------------------
    // 3. Fetch with timeout to plot taxis
    // -----------------------------------------------------------------------
    async function fetchTaxis() {
      // Create an AbortController to cancel the fetch if it takes > 5 seconds
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);
        
      try {
        setStatus('🟡', 'Fetching live map tracking data...');

        // Fetch live data from LTA's taxi availability API
        const response = await fetch('https://api.data.gov.sg/v1/transport/taxi-availability', {
            signal: controller.signal   // connect the abort signal
        });
        clearTimeout(timeoutId);        // clear the timeout if fetch succeeded

        // Check for HTTP errors (e.g. 404, 500)
        if (!response.ok) throw new Error (`HTTP ${response.status}`);

        // Parse the JSON response
        const data = await response.json();

        // Safety verification check: verify if features and geometries exist in the dataset
        if (!data.features || data.features.length === 0 || !data.features[0].geometry) {
            throw new Error('Data format unexpected');
        }

        // All coordinates in that feature are **available** taxis.
        const coords = data.features[0].geometry.coordinates; // array of [lng, lat] pairs. You can look at the JSON object to see the array

        // Remove all previous markers from the map
        taxiLayerGroup.clearLayers();


        let count = 0;
        // Loop over every coordinate pair
        for (const pair of coords) {
          const lng = pair[0];   // longitude
          const lat = pair[1];   // latitude


          // Leaflet requires [lat, lng] - we swap the order here. 
          // Create a small blue circle marker and add it to the layer group.
          // Then attach a popup that simply says "Available taxi".
          L.circleMarker([lat, lng], {
            radius: 4, 
            fillColor: '#0077b6', 
            color: '#005f8c', 
            weight: 1, 
            fillOpacity: 0.8
          }).addTo(taxiLayerGroup).bindPopup('🚖 Available taxi');  // human-centered, all-ages text that everyone can understand

          count++;
        }

        // Update the on-screen taxi count badge
        document.getElementById('count-number').textContent = count.toLocaleString('en-SG');   // gives you x,xxx (with comma) and guarantees the text width is predictable

        // Show success message in the status box
        setStatus('✅ ', `${count.toLocaleString('en-SG')} taxis loaded live.`);
      } catch (e) {
        // If the request was aborted (timed out), show a specific error
        if (e.name === 'AbortError') {
          setStatus('❌', 'Connection timed out. Please try again.');
        } else {
          setStatus('❌', `Error: ${e.message}`);     // any other error (network, HTTP)
        }
      } finally {
        clearTimeout(timeoutId);            // always clean up the timeout
      }
    }

    // Initial load - fetch taxis as soon as the page opens
    // 4. Initial load
    fetchTaxis();

    // Fire the new concurrent background data pipelines
    getWeatherData();
    getTaxiData();
    getWeatherForecastData();


    // --------------------------------------------------------
    // 5. Refresh button with 60-second cooldown
    // --------------------------------------------------------
    const refreshBtn = document.getElementById('refresh-btn');
    let cooldownTimer = null;    // holds the interval ID for the countdown

    // Function that disables the button for 60 seconds and shows a countdown
    function startCooldown() {
      let secondsLeft = 60;
      refreshBtn.disabled = true;
      refreshBtn.textContent = `⏳ Wait ${secondsLeft}s`;

      cooldownTimer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <=0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          refreshBtn.textContent = '🔄 Refresh Taxis';
          refreshBtn.disabled = false;      // re-enable the button
        } else {
          refreshBtn.textContent = `⏳ Wait ${secondsLeft}s`;
        }
      }, 1000);     // update every second
    }

    // When the button is clicked:
    refreshBtn.addEventListener('click', async () => {
        // Prevent double clicks or spamming while the button is disabled
        if (refreshBtn.disabled) return;                // already in cooldown or fetching
        
        refreshBtn.textContent = '⏳ Fetching…';
        refreshBtn.disabled = true;
        setStatus('⏳', 'Fetching live map tracking data...');

        await fetchTaxis();                             // wait for the fetch to complete (or fail)      

        // After fetch finishes, start 60-second cooldown regardless of outcome
        startCooldown();
    });
  </script>
</body>
</html>
