<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Compass - Day 5</title>

  <!-- Referrer policy ensures tile servers get the Referer header, avoiding 403 errors-->
  <meta name="referrer" content="origin-when-cross-origin">

  <!-- Leaflet CSS and JavaScript libraries (loaded from a CDN, no local installation needed)-->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Make the map fill the entire browser window */
    html, body, #map { height: 100%; margin: 0; }

    /* Status box - sits at bottom-left, shows what the app is doing (loading, errors, success) */
    #status {
        position: absolute; 
        bottom: 20px; 
        left: 10px; 
        z-index: 2000;     /* well above the map tiles */
        background: white; 
        padding: 8px 12px; 
        border: 2px solid #333;
        font-family: monospace; 
        font-size: 14px;
    }

    /* Refresh button - centered at the bottom of the screen */
    #refresh-btn {
        position: absolute; 
        bottom: 20px; 
        left: 50%; 
        transform: translateX(-50%);   /* perfect horizontal centering */
        z-index: 1000; 
        padding: 10px 20px; 
        background: #0077b6; 
        color: white;
        border: none; 
        border-radius: 6px; 
        font-size: 16px; 
        font-weight: bold;
        cursor: pointer; 
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        font-family: system-ui, sans-serif;
    }

    /* When the button is disabled (e.g. during cooldown), make it look inactive */
    #refresh-btn:disabled { opacity: 0.6; cursor: default; }

    /* Map title - decorative, sits in the top-right corner, non-clickable */
    .map-title {
      position: absolute; 
      top: 10px; 
      right: 10px; 
      z-index: 1000;
      background: rgba(255,255,255,0.9); 
      padding: 8px 14px; 
      border-radius: 6px; 
      font-family: system-ui, sans-serif;
      font-size: 14px; 
      font-weight: 500;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      pointer-events: none;   /* allows clicks to pass through to the map behind it */
    }
  </style>
</head>
<body>

  <!-- The div that becomes the interactive map -->
  <div id="map"></div>

  <!-- The title of the Map on the top-right corner of the interface -->
  <div class="map-title">🚖 Taxi Compass — street-hailable taxis, made visible</div>

  <!-- Taxi count badge - solid, dark box at top-right, shows total available taxis. (inline style to absolutely guarantee visibility with CSS conflicts)-->
  <div id="taxi count"
        style="
          position: absolute;
          top: 70px;
          right: 10px;
          z-index: 9999;
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 14px 0px;              /* vertical padding only, horizontal is auto-centered */ 
          width: 220px;                   /* fixed width for a consistent box shape */
          text-align: center;
          border-radius: 4px;
          font-family: system-ui, sans-serif;
          font-size: 18px;
          font-weight: 500;
          box-shadow: 0 2px 6px rgba(0,0,0,0.3);
          white-space: nowrap;
          ">
        🚖<span id="count-number">-</span> taxis available</div>
  
  <!-- On-screen status indicator - shows messages like "Loading...", or errors -->
  <div id="status">⏳ Loading... </div>

  <!-- Refresh button - triggers a new data fetch -->
  <button id="refresh-btn">🔄 Refresh Taxis </button>


  <script>
    // ---------------------------------------------------------------
    // HELPER FUNCTION - updates the on-screen status message
    //----------------------------------------------------------------
    const statusEl = document.getElementById('status');
    function setStatus(msg) { statusEl.textContent = '🟡 ' + msg; }   // yellow dot prefix for visibility


    // ----------------------------------------------------------------
    // 1. Map setup
    // ----------------------------------------------------------------
    // Create the Leaflet map, center on Singapore, zoom level 13
    const map = L.map('map').setView([1.3521, 103.8198], 13);

    // Add CartoDB light tiles - works on all browsers without referrer issues
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OSM, © CARTO',         // open-source attribution
      maxZoom: 19
    }).addTo(map);


    // 2. Layer group for taxis (THIS LINE MUST BE PRESENT). This LayerGroup holds all taxi markers - makes it easy to clear and redraw them
    const taxiLayerGroup = L.layerGroup().addTo(map);

    // -----------------------------------------------------------------------
    // 3. Fetch with timeout to plot taxis
    // -----------------------------------------------------------------------
    async function fetchTaxis() {
      // Create an AbortController to cancel the fetch if it takes > 5 seconds
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);
        
      try {
        // Fetch live data from LTA's taxi availability API
        const response = await fetch('https://api.data.gov.sg/v1/transport/taxi-availability', {
            signal: controller.signal   // connect the abort signal
        });
        clearTimeout(timeoutId);        // clear the timeout if fetch succeeded

        // Check for HTTP errors (e.g. 404, 500)
        if (!response.ok) throw new Error (`HTTP ${response.status}`);

        // Parse the JSON response
        const data = await response.json();

        // The API returns a GeoJSON FeatureCollection with one MultiPoint feature.

        // All coordinates in that feature are **available** taxis.
        const coords = data.features[0].geometry.coordinates; // array of [lng, lat] pairs. You can look at the JSON object to see the array

        // Remove all previous markers from the map
        taxiLayerGroup.clearLayers();


        let count = 0;
        // Loop over every coordinate pair
        for (const pair of coords) {
          const lng = pair[0];   // longitude
          const lat = pair[1];   // latitude


          // Leaflet requires [lat, lng] - we swap the order here. 
          // Create a small blue circle marker and add it to the layer group.
          // Then attach a popup that simply says "Available taxi".
          L.circleMarker([lat, lng], {
            radius: 4, 
            fillColor: '#oo77b6', 
            color: '#005f8c', 
            weight: 1, 
            fillOpacity: 0.8
          }).addTo(taxiLayerGroup).bindPopup('🚖 Available taxi');  // human-centered, all-ages text that everyone can understand

          count++;
        }

        // Update the on-screen taxi count badge
        document.getElementById('count-number').textContent = count.toLocaleString('en-SG');   // gives you x,xxx (with comma) and guarantees the text width is predictable

        // Show success message in the status box
        setStatus('✅ ' + count + ' taxis loaded (live) ');
      } catch (e) {
        // If the request was aborted (timed out), show a specific error
        if (e. name === 'AbortError') {
          setStatus('❌ Request timed out after 5 seconds');
        } else {
          setStatus('❌' + e.message);     // any other error (network, HTTP)
        }
      } finally {
        clearTimeout(timeoutId);            // always clean up the timeout
      }
    }

    // Initial load - fetch taxis as soon as the page opens
    // 4. Initial load
    fetchTaxis();


    // --------------------------------------------------------
    // 5. Refresh button with 60-second cooldown
    // --------------------------------------------------------
    const refreshBtn = document.getElementById('refresh-btn');
    let cooldownTimer = null;    // holds the interval ID for the countdown

    // Function that disables the button for 60 seconds and shows a countdown
    function startCooldown() {
      let secondsLeft = 60;
      refreshBtn.disabled = true;
      refreshBtn.textContent = `⏳ Wait ${secondsLeft}s`;

      cooldownTimer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <=0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          refreshBtn.textContent = '🔄 Refresh Taxis';
          refreshBtn.disabled = false;      // re-enable the button
        } else {
          refreshBtn.textContent = `⏳ Wait ${secondsLeft}s`;
        }
      }, 1000);     // update every second
    }

    // When the button is clicked:
    refreshBtn.addEventListener('click', async () => {
        // Prevent double clicks or spamming while the button is disabled
        if (refreshBtn.disabled) return;                // already in cooldown or fetching
        
        refreshBtn.textContent = '⏳ Fetching…';
        refreshBtn.disabled = true;
        setStatus('Fetching...');

        await fetchTaxis();                             // wait for the fetch to complete (or fail)      

        // After fetch finishes, start 60-second cooldown regardless of outcome
        startCooldown();
    });
  </script>
</body>
</html>
