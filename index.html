<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Compass – Working</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map').setView([1.3521, 103.8198], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: 'OSM, CARTO', subdomains: 'abcd', maxZoom: 19
    }).addTo(map);

    const taxiLayer = L.layerGroup().addTo(map);

    async function loadTaxis() {
      const res = await fetch('https://api.data.gov.sg/v1/transport/taxi-availability');
      const data = await res.json();
      const coords = data.features[0].geometry.coordinates;

      taxiLayer.clearLayers();
      for (const pair of coords) {
        L.circleMarker([pair[1], pair[0]], { // Leaflet: [lat, lng]
          radius: 4, fillColor: '#0077b6', color: '#005f8c', weight: 1, fillOpacity: 0.8
        }).addTo(taxiLayer);
      }
    }

    loadTaxis();
  </script>
</body>
</html>
